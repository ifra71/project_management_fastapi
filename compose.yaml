services:
  api:
    build: .
    container_name: fastapi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: fastapi-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis-compose
    ports:
      - "6381:6379"
    restart: unless-stopped

  worker:
    build: .
    container_name: fastapi-worker
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodb_data:
